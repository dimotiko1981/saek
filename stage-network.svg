  <rect x="90" y="350" width="780" height="36" rx="18" fill="url(#bus)"/>
  <text x="480" y="376" fill="#03101b" font-family="Manrope,Arial" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="3">ΚΟΙΝΟΣ ΔΙΑΥΛΟΣ ΔΕΔΟΜΕΝΩΝ</text>
  <g font-family="Manrope,Arial" font-size="17" fill="#b8cad7"><text x="130" y="448">Λιγότερη καλωδίωση</text><text x="380" y="448">Κοινή πληροφορία</text><text x="630" y="448">Ευκολότερη διάγνωση</text></g>
