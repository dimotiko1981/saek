    <g transform="translate(374 240)"><rect x="-82" y="-46" width="164" height="92" rx="16" fill="#0c263f" stroke="#2bd9fe" stroke-opacity=".55" stroke-width="3"/><text y="-2" fill="#fff" font-size="24" font-weight="800">ECU</text><text y="27" fill="#9fb7c8" font-size="16">ABS / ESP</text></g>
    <g transform="translate(588 240)"><rect x="-82" y="-46" width="164" height="92" rx="16" fill="#0c263f" stroke="#2bd9fe" stroke-opacity=".55" stroke-width="3"/><text y="-2" fill="#fff" font-size="24" font-weight="800">ECU</text><text y="27" fill="#9fb7c8" font-size="16">ΟΡΓΑΝΑ</text></g>
    <g transform="translate(802 240)"><rect x="-82" y="-46" width="164" height="92" rx="16" fill="#0c263f" stroke="#2bd9fe" stroke-opacity=".55" stroke-width="3"/><text y="-2" fill="#fff" font-size="24" font-weight="800">ECU</text><text y="27" fill="#9fb7c8" font-size="16">ΑΝΕΣΗ</text></g>
