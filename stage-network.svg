<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Κοινός δίαυλος οχήματος</title>
  <desc id="desc">Τέσσερις ηλεκτρονικές μονάδες συνδεδεμένες σε κοινό δίαυλο δεδομένων.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102c49"/><stop offset="1" stop-color="#061522"/></linearGradient><linearGradient id="bus" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2d67ff"/><stop offset="1" stop-color="#2bd9fe"/></linearGradient></defs>
  <rect width="960" height="540" rx="34" fill="url(#bg)"/>
  <text x="70" y="86" fill="#2bd9fe" font-family="Manrope,Arial" font-size="22" font-weight="800" letter-spacing="4">ΔΙΚΤΥΩΜΕΝΗ ΛΟΓΙΚΗ</text>
  <text x="70" y="140" fill="#f4f8fb" font-family="Manrope,Arial" font-size="42" font-weight="800">Μία γραμμή • πολλά μηνύματα</text>
