  <rect width="960" height="540" rx="34" fill="url(#bg)"/>
  <text x="70" y="88" fill="#ffa75b" font-family="Manrope,Arial" font-size="22" font-weight="800" letter-spacing="4">ΘΕΡΜΟΚΡΑΣΙΑ ΨΥΚΤΙΚΟΥ</text>
  <text x="70" y="142" fill="#f4f8fb" font-family="Manrope,Arial" font-size="42" font-weight="800">Μία μέτρηση • δύο χρήσεις</text>
