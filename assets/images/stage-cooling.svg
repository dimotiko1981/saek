    <g transform="translate(760 238)"><circle r="62" fill="#0b2740" stroke="#2bd9fe" stroke-width="4"/><circle r="19" fill="none" stroke="#8cecff" stroke-width="6"/><path d="M0-48v28M0 20v28M-48 0h28M20 0h28" stroke="#8cecff" stroke-width="7" stroke-linecap="round"/><text y="91" fill="#fff" font-size="19" font-weight="800">ΑΝΕΜΙΣΤΗΡΑΣ</text></g>
