<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Έλεγχος θερμοκρασίας ψυκτικού</title>
  <desc id="desc">Αισθητήρας ECT μετρά 104 βαθμούς, η ECU αποφασίζει και ενεργοποιεί ανεμιστήρα ενώ ενημερώνει τον πίνακα οργάνων.</desc>
